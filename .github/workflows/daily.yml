name: Daily Recruit Intelligence

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 KST, including weekends
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: daily-recruit-intelligence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      MAX_AGE_DAYS: '7'
      MIN_DISPLAY_ITEMS: '3'
      MAX_ITEMS: '6'
      MAX_FEEDS: '50'
      ENTRIES_PER_FEED: '10'
      MAX_CANDIDATES: '80'
      FEED_TIMEOUT: '5'
      HISTORY_LIMIT: '90'
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python scripts/run_daily.py

      - name: Show result summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('web/data.json')
          if not p.exists():
              raise SystemExit('web/data.json not found')
          history = json.loads(p.read_text(encoding='utf-8'))
          latest = history[0] if history else {'date': 'n/a', 'items': []}
          print(f"latest={latest.get('date')} cards={len(latest.get('items', []))}")
          for item in latest.get('items', [])[:5]:
              print(f"- {item.get('cat')} | {item.get('company')} | {item.get('title')}")
          PY

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json archive
          git commit -m "daily recruit intelligence update" || echo "no changes"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
